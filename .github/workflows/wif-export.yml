# TEMPORARY - manual verification of workload identity federation against davidb.descope.team.
# Do not merge this file: it pins a test environment and a branch build of the CLI.
#
# Fill in the two placeholders below, then push to run it. The export action requests this job's
# OIDC token for `<descope_base_url>/<management_key>` and hands it to the CLI as the credential,
# so no management key secret is stored anywhere.
#
# It only passes once davidb.descope.team runs the WIF backend (descope/backend#2038) and the
# management key is federated to the GitHub issuer with claim filters matching this repo.

name: wif-export

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wif-token-credential

permissions:
  # REQUIRED - without this GitHub mints no OIDC token and the action cannot authenticate
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # the local action is used below, and the export action diffs the working tree afterwards
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Export Snapshot
        id: export
        uses: ./.github/actions/export
        with:
          project_id: REPLACE_WITH_PROJECT_ID # P...
          management_key: REPLACE_WITH_MANAGEMENT_KEY_ID # K..., the id rather than the secret
          use_oidc: true
          descope_base_url: https://davidb.descope.team
          files_path: ./descope_export
          # the CLI has to come from this branch too, the released one has no workload token support
          descopecli_version: c18b207

      - name: Show the exported snapshot
        run: find ./descope_export -type f | head -20

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-snapshot
          path: ./descope_export
          if-no-files-found: ignore

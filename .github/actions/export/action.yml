name: Export Snapshot

description: 'Exports a snapshot of all the settings and configurations for a Descope project'

author: 'Descope'

branding:
  icon: 'database'
  color: 'green'

inputs:
  project_id:
    description: 'The id of the Descope project to export from'
    required: true
  management_key:
    description: 'The management key for the Descope project, unless management_key_id is provided'
  management_key_id:
    description: 'The id of the management key to assume through workload identity federation. The action requests the job an OIDC token for it, so no management key secret is stored. Requires the job to grant `id-token: write`. An identifier rather than a secret, so it belongs in a CI variable'
  token_audience:
    description: 'Overrides the audience the workload identity token is requested for. Defaults to `<descope_base_url or https://api.descope.com>/<management_key_id>`, which is what the Descope API derives and expects'
  files_path:
    description: 'The path to the snapshot files (i.e., the directory containing the snapshot.json file)'
    default: '.'
  descopecli_version:
    description: 'The version of the descope CLI tool to use'
    default: 'v0.9.0'
  descope_base_url:
    description: 'The base URL used to communicate with Descope servers (for troubleshooting purposes)'

outputs:
  changes_file:
    description: 'The path to a file that lists changes introduced by the export, or empty if there were no changes'
    value: ${{ steps.check.outputs.changes_file }}

runs:
  using: 'composite'
  steps:
    - name: Install Descope CLI
      uses: descope/descopecli/.github/actions/install@main
      with:
        version: ${{ inputs.descopecli_version }}

    - name: Check State
      shell: bash
      env:
        MANAGEMENT_KEY: ${{ inputs.management_key }}
        MANAGEMENT_KEY_ID: ${{ inputs.management_key_id }}
      run: |
        set +e
        echo "Checking action state"
        if [ -z "${{ inputs.project_id }}" ]; then
          echo "The project_id input is required for this action to run"
          exit 1
        fi
        if [ -n "$MANAGEMENT_KEY" ]; then
          echo ::add-mask::$MANAGEMENT_KEY
        fi
        if [ -z "$MANAGEMENT_KEY" ] && [ -z "$MANAGEMENT_KEY_ID" ]; then
          echo "Either the management_key or the management_key_id input is required for this action to run"
          exit 1
        fi
        # A management key that a workload identity token acts as does not accept its own secret, so the two
        # credentials are exclusive rather than one falling back to the other
        if [ -n "$MANAGEMENT_KEY" ] && [ -n "$MANAGEMENT_KEY_ID" ]; then
          echo "The management_key and management_key_id inputs are exclusive, provide only one"
          exit 1
        fi
        if [ -z "${{ inputs.files_path }}" ]; then
          echo "The files_path input cannot be an empty string"
          exit 1
        fi
        mkdir -p "${{ inputs.files_path }}"
        if [ "$?" != "0" ]; then
          echo "The files_path input must be a valid path: ${{ inputs.files_path }}"
          exit 1
        fi
        if ! [ -d ".git" ]; then
          echo "No git repository found, make sure the checkout action was called"
          exit 1
        fi

    - name: Request Workload Identity Token
      if: ${{ inputs.management_key_id != '' && inputs.management_key == '' }}
      id: wif
      shell: bash
      env:
        MANAGEMENT_KEY_ID: ${{ inputs.management_key_id }}
        TOKEN_AUDIENCE: ${{ inputs.token_audience }}
        DESCOPE_BASE_URL: ${{ inputs.descope_base_url }}
      run: |
        if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          echo "No OIDC token endpoint is available, add 'permissions: id-token: write' to the job"
          exit 1
        fi
        # The Descope API names the management key being assumed by the token's audience, so it has to be
        # requested for exactly `<apiBaseUrl>/<keyId>` and cannot be left to the caller to assemble
        audience="$TOKEN_AUDIENCE"
        if [ -z "$audience" ]; then
          base="${DESCOPE_BASE_URL:-https://api.descope.com}"
          audience="${base%/}/$MANAGEMENT_KEY_ID"
        fi
        echo "Requesting a workload identity token for audience $audience"
        encoded="$(jq -rn --arg a "$audience" '$a|@uri')"
        token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}" | jq -r '.value // empty')"
        if [ -z "$token" ]; then
          echo "Failed to obtain a workload identity token from the GitHub OIDC endpoint"
          exit 1
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Export Snapshot
      shell: bash
      env:
        DESCOPE_MANAGEMENT_KEY: ${{ inputs.management_key }}
        DESCOPE_WORKLOAD_IDENTITY_TOKEN: ${{ steps.wif.outputs.token }}
        DESCOPE_BASE_URL: ${{ inputs.descope_base_url }}
      run: |
        echo "Exporting snapshot"
        rm -rf "${{ inputs.files_path }}"
        mkdir -p "${{ inputs.files_path }}"
        descope project snapshot export "${{ inputs.project_id }}" --path "${{ inputs.files_path }}"

    - name: Check For Changes
      id: check
      shell: bash
      run: |
        echo "Checking if any files were changed"
        if [ -n "$(git status --porcelain=v1 2> /dev/null)" ]; then
          CHANGES_FILE="$(mktemp)"
          git add "${{ inputs.files_path }}"
          git diff HEAD --name-only > $CHANGES_FILE
          git reset HEAD
          echo "Changed files:"
          cat $CHANGES_FILE | sed -e 's|^|  - |'
          echo changes_file="$CHANGES_FILE" >> $GITHUB_OUTPUT
        else
          echo "No files were changed"
        fi
